# if a run fails, run `python bench.py probe <engine>`
# to see which selectors match on the live page, fix  here
#
#   url              page to open
#   private_window   true  = isolated browser context per run 
#                    false = reuse the logged-in Chrome profile (needed for sites that force login)
#   input_box        CSS selectors for the text box, tried in order
#   reply_blocks     CSS selectors for the chatbot's answer blocks (last match is read)
#   busy_indicator   CSS selectors visible only while the bot is still writing. need to verify
#   web_search_off   click these selectors, in order, to turn web search off. Empty =  can't be
#                    run without search, so web-search-off runs are skipped
#   model_label      CSS selector for the label showing which model served the answer
#   sources_panel    CSS selector for the sources/citations panel, when it isn't inside the turn

chatgpt:
  url: https://chatgpt.com/
  private_window: true
  input_box:
    - "textarea[aria-label='Chat with ChatGPT']"
    - "#mobile-composer-prompt"
    - "textarea[name='prompt']"
  turn_blocks:
    - "li[data-message-role='assistant']"
  done_attr: "data-message-complete"
  prose_parts: ["[data-assistant-markdown] > :not([data-assistant-product-list]):not([data-assistant-grouped-webpages]):not([data-content-reference-type])"]
  sources_payload: "[data-assistant-sources-payload]"
  product_payload: "[data-assistant-product-payload]"
  reply_blocks: ["li[data-message-role='assistant']"]
  busy_indicator:
    - "button[data-composer-submit]:not([aria-disabled='true']) [data-composer-stop-icon]:visible"
  web_search_off: [] # auto searches
  model_label: "div.text-token-text-secondary:has(svg)"
  sources_panel: "[data-testid='sources-panel'], .sources-drawer"

gemini:
  url: https://gemini.google.com/app
  private_window: true
  input_box: ["rich-textarea div[contenteditable='true']", "div[contenteditable='true']"]
  reply_blocks: ["message-content", ".model-response-text"]
  busy_indicator: ["button[aria-label*='Stop']"]
  web_search_off: [] # can't toggle
  model_label: ".model-selector-button .label"
  sources_panel: "bottom-sheet.sources"

gemini-judge:
  url: https://gemini.google.com/app
  private_window: false
  port: 9223
  input_box: ["rich-textarea div[contenteditable='true']", "div[contenteditable='true']"]
  reply_blocks: ["message-content", ".model-response-text"]
  busy_indicator: ["button[aria-label*='Stop']"]
  copy_button: "mat-icon[data-mat-icon-name='copy']"

perplexity:
  url: https://www.perplexity.ai/
  private_window: false #requires signin
  port: 9223 
  input_box: ["#ask-input", "div[contenteditable='true']", "textarea"]
  reply_blocks: ["div[id^='markdown-content']", ".prose"]
  busy_indicator: ["button[aria-label*='Stop']"]
  web_search_off: []          # always searches
  model_label: ".model-badge, [aria-label='Model']"
  sources_panel: ".sources-list, div[class*='Sources']"

